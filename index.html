    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // Guard AbortController.prototype.abort from throwing synchronous AbortError
          if (typeof AbortController !== 'undefined' && AbortController.prototype && AbortController.prototype.abort) {
            var origAbort = AbortController.prototype.abort;
            AbortController.prototype.abort = function(reason) {
              try {
                return origAbort.apply(this, arguments);
              } catch (e) {
                if (e && (e.name === 'AbortError' || (e.message && e.message.indexOf('aborted') !== -1))) {
                  return;
                }
                throw e;
              }
            };
          }

          function isIgnorableError(err) {
            if (!err) return false;
            var msg = (err.message || String(err)).toLowerCase();
            var name = (err.name || '').toLowerCase();
            return name === 'aborterror' ||
                   name === 'quotaexceedederror' ||
                   msg.indexOf('signal is aborted') !== -1 ||
                   msg.indexOf('aborterror') !== -1 ||
                   msg.indexOf('failed to fetch') !== -1 ||
                   msg.indexOf('networkerror') !== -1 ||
                   msg.indexOf('load failed') !== -1 ||
                   msg.indexOf('file_error_no_space') !== -1 ||
                   msg.indexOf('indexeddb') !== -1 ||
                   msg.indexOf('leveldb') !== -1 ||
                   msg.indexOf('io error') !== -1 ||
                   msg.indexOf('writablefileappend') !== -1 ||
                   msg.indexOf('missing or insufficient permissions') !== -1;
          }

          window.addEventListener('unhandledrejection', function(event) {
            if (isIgnorableError(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            if (isIgnorableError(event.error) || isIgnorableError(event.message)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
